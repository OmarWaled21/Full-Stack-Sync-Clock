{% extends 'base_home.html' %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4 text-center text-primary">Users Under Your Account</h2>
  <div class="mb-4 text-end">
    <a href="{% url 'add_user' %}" class="btn btn-success">+ Add New User</a>
  </div>
  {% if users %}
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      {% for user in users %}
        <div class="col">
          <div class="card shadow-sm border-primary">
            <div class="card-body">
              <h5 class="card-title">{{ user.username }}</h5>
              <p class="card-text">
                <strong>Role:</strong> 
                <span class="badge 
                  {% if user.rule == 'admin' %} bg-danger 
                  {% elif user.rule == 'supervisor' %} bg-warning text-dark 
                  {% else %} bg-success 
                  {% endif %}
                ">
                  {{ user.rule|title }}
                </span>
              </p>
              <div class="d-flex justify-content-between mt-3">
                <a href="{% url 'edit_user' user.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
                <a href="{% url 'delete_user' user.id %}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Are you sure you want to delete {{ user.username }}?');">Delete</a>
              </div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-info text-center" role="alert">
      No users assigned to you.
    </div>
  {% endif %}
</div>
{% endblock %}
