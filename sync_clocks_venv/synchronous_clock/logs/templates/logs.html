{% extends 'base_home.html' %} {% block content %}
<div class="container mt-4">
  <h2>System Logs</h2>

  <!-- رابط لتحميل الـ PDF -->
  <a href="{% url 'download_logs_pdf' %}" class="btn btn-primary mb-3"
    >Download Logs as PDF</a
  >

  <!-- إضافة فلتر حسب التاريخ -->
  <div class="mb-3">
    <label for="filter-date" class="form-label">Filter Logs By Date</label>
    <div class="input-group">
      <input
        type="date"
        class="form-control"
        id="filter-date"
        name="filter-date"
      />
      <button class="btn btn-outline-primary" id="filter-button">Filter</button>
      <button class="btn btn-outline-secondary" id="all-logs-button">
        All Logs
      </button>
    </div>
  </div>

  <table class="table table-striped table-bordered mt-3">
    <thead class="thead-dark">
      <tr>
        <th>Device</th>
        <th>Timestamp</th>
        <th>Error Type</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody id="logs-container">
      {% include 'logs_rows.html' %}
    </tbody>
  </table>
</div>
{% endblock %} {% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
  // تعديل دالة updateLogs
  $(document).ready(function () {
    // تعيين تاريخ اليوم كقيمة افتراضية
    var today = new Date();
    var todayStr = today.toISOString().split("T")[0];
    $("#filter-date").val(todayStr);

    // عند الضغط على زر الفلتر
    $("#filter-button").click(function () {
      var selectedDate = $("#filter-date").val();
      if (!selectedDate) {
        alert("Please select a date first");
        return;
      }
      updateLogs(selectedDate);
    });

    // عند الضغط على زر All Logs
    $("#all-logs-button").click(function () {
      // مسح حقل التاريخ
      $("#filter-date").val("");

      // إخفاء أي رسائل خطأ سابقة
      $(".error-message").remove();

      // إعادة تحميل جميع السجلات
      updateLogs("");
    });

    // دالة تحديث السجلات
    function updateLogs(dateFilter = "") {
      console.log("Filtering with date:", dateFilter); // لأغراض التصحيح

      // إظهار حالة التحميل
      $("#logs-container").html(`
            <tr>
                <td colspan="4" class="text-center py-3">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <span class="ms-2">Filtering logs...</span>
                </td>
            </tr>
        `);

      // تحضير بيانات الطلب
      let requestData = {};
      if (dateFilter) {
        requestData.filter_date = dateFilter;
      }

      // إضافة device_id إذا كان موجودًا
      let deviceId = new URLSearchParams(window.location.search).get(
        "device_id"
      );
      if (deviceId) {
        requestData.device_id = deviceId;
      }

      // إرسال طلب AJAX
      $.ajax({
        url: window.location.pathname,
        type: "GET",
        data: requestData,
        success: function (data) {
          console.log("Received data:", data); // لأغراض التصحيح
          $("#logs-container").html(data.html);
          updatePdfLink(dateFilter);
        },
        error: function (xhr, status, error) {
          console.error("Error:", error);
          $("#logs-container").html(`
                    <tr>
                        <td colspan="4" class="text-center text-danger py-3">
                            Error loading logs. Please try again.
                        </td>
                    </tr>
                `);
        },
      });
    }

    // دالة تحديث رابط PDF
    function updatePdfLink(dateFilter) {
      let pdfUrl = "{% url 'download_logs_pdf' %}?";
      if (dateFilter) pdfUrl += "filter_date=" + encodeURIComponent(dateFilter);
      $("#pdf-download-link").attr("href", pdfUrl);
    }
  });
</script>
{% endblock %}
